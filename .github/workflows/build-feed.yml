name: Build podcast feed

on:
  push:
    paths:
      - 'docs/episodes/**'
      - 'docs/podcast.json'
      - 'scripts/build_feed.py'
      - 'scripts/transcode.py'
      - '.github/workflows/build-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ubuntu-latest 가 22.04 → 24.04 로 업그레이드되면서 ffmpeg 가 default
      # 설치에서 빠짐 (FileNotFoundError: 'ffmpeg' 로 fail). 명시 설치해야 안정.
      # 캐시 update 생략하고 바로 install — apt 가 알아서 최신 ffmpeg + libmp3lame.
      # 2026-11-11: 러너의 apt 미러가 멈춰 ffmpeg 설치가 실패하면서 피드 빌드 전체가 막힘.
      # → apt 는 3분만 시도하고, 안 되면 pip 의 정적 ffmpeg(imageio-ffmpeg) 로 대체.
      #   transcode.py 는 ffmpeg 만 씀 (ffprobe 불필요). 둘 다 실패해도 피드 빌드는 계속.
      - name: Install ffmpeg (for transcode)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          if timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg; then exit 0; fi
          echo "apt 실패 → imageio-ffmpeg 로 대체"
          pip install --quiet imageio-ffmpeg
          sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1

      # podcast.json 의 transcode.enabled 가 true 일 때만 실제 변환. enabled=false
      # 면 no-op (transcode.py 가 빠져나감).
      - name: Transcode m4a/mp4 → mp3 (if enabled)
        continue-on-error: true
        run: python scripts/transcode.py

      - name: Build feed.xml
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/build_feed.py

      # 익스텐션의 ghPut 이 짧은 간격으로 여러 episode 를 push 하면 첫 workflow
      # 가 commit + push 하는 사이에 main 이 다음 commit 으로 advance 돼 push 가
      # rejected (non fast-forward) 됨. concurrency group 은 같은 workflow 두 run
      # 사이만 막을 뿐 외부 push 와는 무관해서 별도 회복 필요. 매 retry 마다
      # origin/main 으로 reset 후 idempotent 빌드 재실행 — feed.xml + retention 이
      # 항상 최신 episodes 디렉토리 기준으로 다시 산출되도록.
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          attempts=0
          max_attempts=3
          while [ $attempts -lt $max_attempts ]; do
            attempts=$((attempts + 1))

            if [ $attempts -gt 1 ]; then
              echo "[attempt $attempts] fetching latest main and rebuilding"
              git fetch origin main
              git reset --hard origin/main
              python scripts/transcode.py
              python scripts/build_feed.py
            fi

            # docs/episodes/ 에서 retention 으로 삭제된 파일도 stage 되도록 -A.
            git add -A docs/feed.xml docs/episodes
            if git diff --cached --quiet; then
              echo 'feed unchanged, skipping commit'
              exit 0
            fi

            git commit -m 'auto: rebuild feed'
            if git push; then
              echo "[attempt $attempts] push succeeded"
              exit 0
            fi
            echo "[attempt $attempts] push rejected (concurrent push) — retrying"
            sleep $((attempts * 2))
          done

          echo "push failed after $max_attempts attempts"
          exit 1
